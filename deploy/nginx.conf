# deploy/nginx.conf — Argus Nginx 설정 템플릿
# setup.sh가 __ARGUS_DIR__ 플레이스홀더를 실제 경로로 치환한 뒤 복사합니다.
# 직접 편집하지 말고 setup.sh를 통해 배포하세요.

server {
    listen 80;
    server_name _;

    # 정적 파일 (React 빌드 산출물)
    root __ARGUS_DIR__/frontend/dist;
    index index.html;

    # AI-HUB 샘플 이미지 직접 서빙 (FastAPI 우회 — 성능)
    location /data/ {
        alias __ARGUS_DIR__/data/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 학생 업로드 이미지 직접 서빙
    location /uploads/ {
        alias __ARGUS_DIR__/backend/uploads/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # API → FastAPI 프록시
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 이미지 업로드 최대 크기 (10MB)
        client_max_body_size 10M;
        proxy_read_timeout 300s;
    }

    # Health check → FastAPI 프록시
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # React SPA — 모든 미매칭 경로를 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip 압축
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
